[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonprocessor"
version = "1.0.0"
description = "JsonProcessor: an open-source local workbench for JSON, text and Excel workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["workbench*"]
